# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.paper.system
repository:
  id: repo.paper-kb
  github: matuteiglesias/paper-kb
domain: knowledge
system: kb.paper
role: paper-knowledge-modular-monorepo
lifecycle: active
authority:
  status: proposed
  owns:
  - paper source acquisition and parser adapters
  - canonical paper and chunk identity plus paper corpus production
  - producer-owned paper-domain contracts and review projection semantics
  - repository-local paper read service and paper-specific derivations
  - paper workbench implementation
  does_not_own:
  - shared interoperability contract authority
  - general knowledge inspection
  - review snapshot compilation or snapshot-reader semantics
  - evidence selection or promotion policy
  - estate routing or MCP access policy
interfaces:
  consumes: []
  produces:
  - artifact:kb.paper-chunk-set@1
  - artifact:paper.review-record@1
  declares:
  - contract:paper.review-record@1
  compatibility:
  - format:review-csv
upstream:
- repo.kb-contracts
downstream:
- repo.knowledge-inspect
- repo.abstract-scroller
canonical_commands:
- make corpus-doctor CORPUS=tesislcd
- make corpus-parse CORPUS=tesislcd
- make corpus-validate CORPUS=tesislcd
- make contract-review-record
- make export-review-records CORPUS=tesislcd
- make api-corpus CORPUS=tesislcd PORT=9000
compatibility_commands:
- make export-review-csv CORPUS=tesislcd
- make export-review CORPUS=tesislcd
generated_paths:
- corpora/
- artifacts/
verification:
  status: bounded-interface-proofs
  last_verified: '2026-08-29'
  command: make contract-review-record
  proven:
  - paper-kb chunk_set validates in Knowledge Inspect through pinned W3 cross-repo CI
  - canonical paper.review-record@1 JSONL is projected directly from governed chunk_set artifacts
  - canonical projection fails closed when paper_uid is absent or duplicated
  - Abstract Scroller consumes pinned canonical paper.review-record@1 output and preserves paper_uid across snapshot compilation
  compatibility_proven:
  - legacy review CSV still compiles into Abstract Scroller through the retained compatibility proof
  unknowns:
  - current ChunkSetStorageAdapter does not consistently elevate canonical paper_uid into its paper-level read model; canonical review projection deliberately does not depend on that service layer
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
