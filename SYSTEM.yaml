# This file declares the repository boundary and its place in the GitHub estate.
schema_version: 1
id: kb.paper.corpus
repository:
  id: repo.paper-kb
  github: matuteiglesias/paper-kb
domain: knowledge
system: kb.paper
role: paper-corpus-producer
lifecycle: active
authority:
  status: proposed
  owns:
  - paper ingestion and parsing
  - paper-oriented chunks and review exports
  - paper corpus APIs and structured summaries
  does_not_own:
  - shared interoperability contract authority
  - general chat knowledge ingestion
  - estate routing or MCP access policy
interfaces:
  consumes:
  - contract:kb.chunk-set@1
  - contract:kb.review-node@1
  produces:
  - artifact:kb.paper-chunk-set@1
  - artifact:kb.review-node@1
upstream:
- repo.kb-contracts
downstream:
- repo.knowledge-inspect
canonical_commands:
- make corpus-doctor CORPUS=tesislcd
- make corpus-parse CORPUS=tesislcd
- make corpus-validate CORPUS=tesislcd
- make export-review CORPUS=tesislcd
- make api-corpus CORPUS=tesislcd PORT=9000
generated_paths:
- data/
- artifacts/
verification:
  status: metadata-only
  last_verified: '2026-08-28'
  command: make corpus-validate CORPUS=tesislcd
  unknowns:
  - canonical commands were reconciled against the README operator surface but not executed during W2
  - exact current contract adoption for every producer output remains an interface-proof task for W3
maintenance:
  cadence: quarterly
  next_review: '2026-11-01'
