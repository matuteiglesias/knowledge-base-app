name: Run real PDF hardening patch

on:
  push:
    branches:
      - real-use/real-pdf-end-to-end-proof
    paths:
      - scripts/_apply_real_pdf_hardening_once.py
      - scripts/_repair_real_pdf_hardening_fixture.py
      - .github/workflows/run-real-pdf-hardening-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: real-use/real-pdf-end-to-end-proof
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded source patch
        run: |
          python scripts/_apply_real_pdf_hardening_once.py
          python scripts/_repair_real_pdf_hardening_fixture.py
      - name: Validate bounded patch
        run: |
          python -m pip install -q -r requirements-pipeline.txt pytest fastapi
          python -m pytest -q tests/test_tei_bibliographic_metadata.py tests/test_grobid_consolidation_policy.py tests/test_identity_contract.py tests/test_read_model_identity.py tests/test_chunk_set_writer_contract.py tests/test_review_record_projection.py tests/test_catalog_record_projection.py
          git diff --check
      - name: Commit source changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pipeline backend requirements-pipeline.txt tests
          git diff --cached --check
          git commit -m 'feat: preserve real PDF metadata through governed paper artifacts'
          git push origin HEAD:real-use/real-pdf-end-to-end-proof
