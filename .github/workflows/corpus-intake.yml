name: Governed corpus intake

on:
  pull_request:
    paths:
      - 'pipeline/sources/corpus_intake.py'
      - 'pipeline/adapter/grobid_preflight.py'
      - 'pipeline/corpus.py'
      - 'tests/test_corpus_intake.py'
      - 'tests/test_grobid_preflight.py'
      - 'tests/test_corpus_paths.py'
      - 'Makefile'
      - '.gitignore'
      - '.github/workflows/corpus-intake.yml'
  push:
    branches: [main]
    paths:
      - 'pipeline/sources/corpus_intake.py'
      - 'pipeline/adapter/grobid_preflight.py'
      - 'pipeline/corpus.py'
      - 'tests/test_corpus_intake.py'
      - 'tests/test_grobid_preflight.py'
      - 'tests/test_corpus_paths.py'
      - 'Makefile'
      - '.gitignore'
      - '.github/workflows/corpus-intake.yml'

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests python-dotenv
      - name: Test corpus intake, GROBID preflight and corpus path semantics
        run: python -m pytest -q tests/test_corpus_intake.py tests/test_grobid_preflight.py tests/test_corpus_paths.py
      - name: Check operator help exposes governed intake
        run: |
          make help | grep -F 'corpus-register'
          make help | grep -F 'corpus-check-grobid'
          make help | grep -F 'corpus-build'
