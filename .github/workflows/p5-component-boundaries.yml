name: P5 executable component boundaries

on:
  pull_request:
  push:
    branches:
      - refactor/p5-executable-component-boundaries

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded test dependencies
        run: python -m pip install 'pydantic<2' pytest jsonschema
      - name: Compile affected components
        run: python -m compileall -q pipeline/contracts pipeline/projections backend/app backend/exports
      - name: Enforce architecture boundaries
        run: python tests/test_component_boundaries.py
      - name: Prove read-model identity preservation
        run: python tests/test_read_model_identity.py
      - name: Preserve review contract and projection proofs
        run: |
          python tests/test_review_record_contract.py
          python tests/test_review_record_projection.py
          python tests/test_review_surface_governance.py
      - name: Regression - storage and legacy CSV compatibility
        run: pytest -q tests/test_chunk_set_storage_adapter.py tests/test_export_review_csv.py
