name: Reconcile real fixture checksums once

on:
  push:
    branches: [fixtures/real-paper-samples]
    paths:
      - '.github/workflows/fixture-checksum-once.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fixtures/real-paper-samples
      - name: Verify bounded fixture set and refresh checksums
        run: |
          set -euo pipefail
          mapfile -t pdfs < <(find fixture/real_samples/raw -maxdepth 1 -type f -name '*.pdf' -print | sort)
          test "${#pdfs[@]}" -eq 2
          sha256sum "${pdfs[@]}" > fixture/real_samples/SHA256SUMS
          cat fixture/real_samples/SHA256SUMS
      - name: Commit checksum reconciliation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixture/real_samples/SHA256SUMS
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: cover both real PDF fixtures in checksum manifest'
          git push origin HEAD:fixtures/real-paper-samples
